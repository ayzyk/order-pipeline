name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      kafka:
        # the default config of this image is a single KRaft node on localhost:9092
        image: apache/kafka:4.3.2
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/orders?sslmode=disable
          TEST_KAFKA_BROKERS: localhost:9092

  kubernetes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Build and load the image
        run: |
          docker build -t order-pipeline:dev .
          kind load docker-image order-pipeline:dev --name ci
      - name: Deploy
        run: |
          kubectl apply -k deploy/k8s/overlays/kind
          for d in postgres kafka api relay worker; do
            kubectl -n order-pipeline rollout status deploy/$d --timeout=300s
          done
      - name: Smoke test
        run: |
          kubectl -n order-pipeline port-forward svc/api 8080:80 &
          ./scripts/smoke.sh http://localhost:8080
      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n order-pipeline get pods,events
          kubectl -n order-pipeline logs -l app.kubernetes.io/part-of=order-pipeline --all-containers --tail=50 --prefix

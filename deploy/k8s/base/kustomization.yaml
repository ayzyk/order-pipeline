apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: order-pipeline

resources:
  - api.yaml
  - relay.yaml
  - worker.yaml

configMapGenerator:
  - name: order-pipeline-config
    literals:
      - KAFKA_BROKERS=kafka:9092
      - ORDERS_TOPIC=orders.events
      - ORDERS_DLQ_TOPIC=orders.events.dlq

images:
  - name: order-pipeline
    newName: ghcr.io/ayzyk/order-pipeline
    newTag: latest
